name: Regenerate PluginMaster

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 */12 * * *'

concurrency: regenerate

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
            python-version: '3.12'
            cache: 'pip'

      - name: Generate PluginMaster
        run: |
          pip install -r requirements.txt
          python generate_pluginmaster.py

      - name: Commit PluginMaster
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          author_name: GitHub Action
          author_email: github-actions[bot]@users.noreply.github.com
          message: Regenerate PluginMaster